packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: false
  ffmpeg-static: true
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  msw: false
  onnxruntime-node: false
  protobufjs: false
  electron-winstaller: false

catalog:
  "mediabunny": "1.62.0"
  "@shadcn/lint": "0.2.3"
  "vite-plus": 1.4.0
  "vite": npm:@voidzero-dev/vite-plus-core@1.4.0
  "typescript": "7.0.2"
  "@types/node": "24.12.4"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "@tanstack/react-start": "1.169.3"
  "@tanstack/react-router": "1.170.45"
  "@tanstack/router-cli": "1.167.41"
  "@vitejs/plugin-react": "6.1.2"
  "@tailwindcss/vite": "4.3.3"
  "tailwindcss": "4.3.3"
  "@remixicon/react": "4.9.0"
  "effect": "4.0.5"
  "electron": "45.0.0"
  "zustand": "5.0.15"

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
